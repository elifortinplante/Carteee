<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion</title>


<style>

body{

font-family:Arial;
text-align:center;
padding:20px;

}


input{

display:block;
margin:10px auto;
padding:12px;
width:250px;
font-size:16px;

}



button{

padding:12px;
margin:5px;
font-size:16px;

}



#message{

margin-top:20px;

}



</style>

</head>


<body>


<h1>🔑 Connexion</h1>


<input 
id="email"
type="email"
placeholder="Email"
>


<input 
id="password"
type="password"
placeholder="Mot de passe"
>



<button onclick="creerCompte()">
Créer un compte
</button>


<button onclick="connexion()">
Se connecter
</button>



<p id="message"></p>



<script type="module">


import { auth } 
from "./firebase.js";


import {

createUserWithEmailAndPassword,

signInWithEmailAndPassword,

onAuthStateChanged

}

from 

"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";





const email =
document.getElementById("email");

const password =
document.getElementById("password");

const message =
document.getElementById("message");







window.creerCompte=function(){



createUserWithEmailAndPassword(

auth,

email.value,

password.value

)


.then((result)=>{


message.innerHTML=

"✅ Compte créé";



setTimeout(()=>{


location.href="index.html";


},1000);



})


.catch((erreur)=>{


message.innerHTML=

"❌ "+erreur.message;



});



}








window.connexion=function(){



signInWithEmailAndPassword(

auth,

email.value,

password.value

)


.then(()=>{


message.innerHTML=

"✅ Connexion réussie";



setTimeout(()=>{


location.href="index.html";


},1000);



})


.catch((erreur)=>{


message.innerHTML=

"❌ "+erreur.message;



});



}








onAuthStateChanged(auth,(user)=>{



if(user){


console.log(

"Utilisateur connecté :",

user.email

);


}



});





</script>


</body>

</html>
