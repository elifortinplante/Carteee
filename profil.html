<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil</title>


<style>

body{

font-family:Arial;
text-align:center;
padding:20px;

}


input{

padding:12px;
font-size:16px;
margin:10px;
width:250px;

}


button{

padding:12px;
margin:5px;
font-size:16px;

}


.carte{

background:#f2f2f2;
border-radius:15px;
padding:20px;
margin:20px auto;
max-width:400px;

}


</style>


</head>


<body>


<h1>⚙️ Profil</h1>


<div class="carte">


<p>
📧 Email :
</p>

<p id="email">
Chargement...
</p>



<p>
Nom affiché :
</p>


<input 
id="nom"
placeholder="Ton nom"
>



<br>


<button onclick="sauvegarderProfil()">

💾 Sauvegarder

</button>


<button onclick="deconnexion()">

🚪 Déconnexion

</button>


<p id="message"></p>


</div>




<button onclick="location.href='index.html'">

🗺️ Carte

</button>



<script type="module">


import { auth, db } 
from "./firebase.js";



import {

onAuthStateChanged,

signOut

}

from 

"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";



import {

doc,

setDoc,

getDoc

}

from 

"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";







let utilisateur=null;



const email=

document.getElementById("email");


const nom=

document.getElementById("nom");


const message=

document.getElementById("message");








onAuthStateChanged(auth, async(user)=>{


if(!user){


location.href="connexion.html";


return;


}



utilisateur=user;



email.innerHTML=user.email;




// Charger le profil existant


let profilRef=

doc(

db,

"utilisateurs",

user.uid

);



let profil=

await getDoc(profilRef);



if(profil.exists()){


nom.value=

profil.data().nom || "";


}



});









window.sauvegarderProfil=async function(){



if(!utilisateur)

return;




let ref=

doc(

db,

"utilisateurs",

utilisateur.uid

);






await setDoc(

ref,

{


email:

utilisateur.email,


nom:

nom.value,


niveau:

1,


xp:

0


},

{

merge:true

}

);




message.innerHTML=

"✅ Profil sauvegardé";



}








window.deconnexion=function(){



signOut(auth)

.then(()=>{


location.href="connexion.html";


});



}



</script>


</body>

</html>
