<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Map Vélo</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
>


<style>

/* ================================================= */
/* BASE */
/* ================================================= */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    font-family:Arial,sans-serif;

    background:#f5f5f5;

    overflow:hidden;

    touch-action:pan-y;
}


/* ================================================= */
/* APPLICATION */
/* ================================================= */

#application{

    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

}


/* ================================================= */
/* EN-TÊTE */
/* ================================================= */

#entete{

    height:62px;
    min-height:62px;

    background:white;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    box-shadow:0 2px 8px rgba(0,0,0,0.12);

    z-index:500;

}


/* ================================================= */
/* TITRE */
/* ================================================= */

#titreSport{

    font-size:25px;

    font-weight:bold;

    user-select:none;

}


/* ================================================= */
/* BOUTON 3 BARRES */
/* ================================================= */

#boutonSports{

    position:absolute;

    right:18px;

    top:50%;

    transform:translateY(-50%);

    width:30px;

    height:30px;

    padding:0;

    border:none;

    background:transparent;

    box-shadow:none;

    font-size:0;

    cursor:pointer;

}


/* Les trois vraies barres */

#boutonSports::before,
#boutonSports::after{

    content:"";

    position:absolute;

    left:4px;

    width:22px;

    height:3px;

    background:#222;

    border-radius:3px;

}


#boutonSports::before{

    top:6px;

    box-shadow:
        0 7px 0 #222,
        0 14px 0 #222;

}


#boutonSports::after{

    display:none;

}


/* ================================================= */
/* MENU SPORTS */
/* ================================================= */

#menuSports{

    display:none;

    position:absolute;

    right:12px;

    top:57px;

    width:190px;

    background:white;

    border-radius:18px;

    padding:8px;

    box-shadow:0 5px 20px rgba(0,0,0,0.2);

    z-index:2000;

}


/* ================================================= */
/* CHOIX SPORT */
/* ================================================= */

.choixSport{

    padding:13px;

    margin:3px 0;

    border-radius:12px;

    font-size:17px;

    cursor:pointer;

}


.choixSport:hover{

    background:#f0f0f0;

}


/* SPORT ACTUEL */

.choixSport.actuel{

    border:2px solid #222;

    background:#f5f5f5;

}


/* ================================================= */
/* CARTE */
/* ================================================= */

#map{

    width:94%;

    height:48vh;

    min-height:250px;

    margin:10px auto 0 auto;

    border-radius:24px;

    overflow:hidden;

    box-shadow:0 2px 12px rgba(0,0,0,0.18);

    flex-shrink:0;

}


/* ================================================= */
/* PARTIE BASSE */
/* ================================================= */

#bas{

    flex:1;

    overflow-y:auto;

    padding:10px 15px 85px 15px;

    text-align:center;

}


/* ================================================= */
/* SOUS-TITRE DU DERNIER TRAJET */
/* ================================================= */

#dernierTitre{

    font-size:21px;

    font-weight:bold;

    margin:4px auto 5px auto;

    cursor:pointer;

    width:max-content;

    padding:7px 14px;

    border-radius:12px;

}


#dernierTitre:active{

    background:#e8e8e8;

}


/* ================================================= */
/* INFORMATIONS DERNIER TRAJET */
/* ================================================= */

#dernierInfos{

    background:white;

    border-radius:18px;

    padding:10px;

    max-width:450px;

    margin:0 auto 10px auto;

    box-shadow:0 2px 8px rgba(0,0,0,0.08);

    font-size:16px;

}


/* ================================================= */
/* BOUTONS D'ACTION */
/* ================================================= */

#actions{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:8px;

    max-width:500px;

    margin:0 auto;

}


.action{

    width:58px;

    height:48px;

    border:none;

    border-radius:15px;

    background:white;

    font-size:23px;

    box-shadow:0 2px 8px rgba(0,0,0,0.12);

    cursor:pointer;

}


.action:active{

    transform:scale(0.95);

}


/* ================================================= */
/* PANNEAU SUPPRESSION */
/* ================================================= */

#panneauSuppression{

    display:none;

    position:fixed;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    width:88%;

    max-width:400px;

    background:white;

    border-radius:25px;

    padding:22px;

    box-shadow:0 8px 30px rgba(0,0,0,0.3);

    z-index:5000;

    text-align:center;

}


#panneauSuppression h2{

    margin-top:0;

}


.boutonSuppression{

    width:100%;

    padding:14px;

    margin:7px 0;

    border:none;

    border-radius:14px;

    font-size:17px;

    cursor:pointer;

}


#effacerUn{

    background:#eeeeee;

}


#effacerTout{

    background:#ffdddd;

}


#annulerSuppression{

    background:#eeeeee;

}


/* ================================================= */
/* PANNEAU SÉLECTION */
/* ================================================= */

#panneauSelection{

    display:none;

    position:fixed;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    width:90%;

    max-width:500px;

    max-height:80vh;

    overflow-y:auto;

    background:white;

    border-radius:25px;

    padding:20px;

    box-shadow:0 8px 30px rgba(0,0,0,0.3);

    z-index:5000;

}


#panneauSelection h2{

    text-align:center;

    margin-top:0;

}


/* ================================================= */
/* TRI */
/* ================================================= */

#boutonTri{

    display:block;

    margin:0 auto 12px auto;

    padding:10px 18px;

    border:none;

    background:#eeeeee;

    border-radius:13px;

    font-size:16px;

    cursor:pointer;

}


#menuTri{

    display:none;

    background:#f5f5f5;

    border-radius:15px;

    padding:7px;

    margin-bottom:12px;

}


.choixTri{

    padding:11px;

    border-radius:10px;

    cursor:pointer;

    font-size:16px;

}


.choixTri:hover{

    background:#e4e4e4;

}


/* ================================================= */
/* TRAJETS DANS LA LISTE */
/* ================================================= */

.trajetChoix{

    background:#f1f1f1;

    border-radius:15px;

    padding:14px;

    margin:8px 0;

    cursor:pointer;

}


.trajetChoix:active{

    background:#dddddd;

}


#fermerSelection{

    width:100%;

    padding:12px;

    border:none;

    border-radius:13px;

    background:#eeeeee;

    font-size:16px;

    margin-top:10px;

}


/* ================================================= */
/* CONFIRMATION */
/* ================================================= */

#confirmation{

    display:none;

    position:fixed;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    width:85%;

    max-width:360px;

    background:white;

    border-radius:23px;

    padding:22px;

    box-shadow:0 8px 30px rgba(0,0,0,0.3);

    z-index:6000;

    text-align:center;

}


#confirmation h3{

    margin-top:0;

}


.confirmationBoutons{

    display:flex;

    gap:8px;

}


.confirmationBoutons button{

    flex:1;

    padding:13px;

    border:none;

    border-radius:13px;

    font-size:16px;

}


#boutonAnnuler{

    background:#eeeeee;

}


#boutonConfirmer{

    background:#ff4d4d;

    color:white;

}


/* ================================================= */
/* MESSAGE */
/* ================================================= */

#message{

    display:none;

    position:fixed;

    left:50%;

    top:15px;

    transform:translateX(-50%);

    background:#222;

    color:white;

    padding:12px 20px;

    border-radius:15px;

    z-index:7000;

    font-size:15px;

}


/* ================================================= */
/* PETITS ÉCRANS */
/* ================================================= */

@media(max-height:650px){

    #map{

        height:43vh;

    }

    #dernierInfos{

        padding:7px;

    }

    #bas{

        padding-top:6px;

    }

}


/* ================================================= */
/* BARRE DE DÉFILEMENT */
/* ================================================= */

#bas::-webkit-scrollbar,
#panneauSelection::-webkit-scrollbar{

    display:none;

}

</style>

</head>


<body>


<div id="application">


<!-- ================================================= -->
<!-- EN-TÊTE -->
<!-- ================================================= -->

<div id="entete">


<div id="titreSport">
    🚲 Vélo
</div>


<button
    id="boutonSports"
    onclick="ouvrirSports()"
    aria-label="Choisir un sport"
>
</button>


<!-- ================================================= -->
<!-- MENU SPORTS -->
<!-- ================================================= -->

<div id="menuSports">


<div
    class="choixSport"
    data-sport="Vélo"
    onclick="choisirSport('Vélo')"
>
    🚲 Vélo
</div>


<div
    class="choixSport"
    data-sport="Marche"
    onclick="choisirSport('Marche')"
>
    🚶 Marche
</div>


<div
    class="choixSport"
    data-sport="Course"
    onclick="choisirSport('Course')"
>
    🏃 Course
</div>


</div>

</div>


<!-- ================================================= -->
<!-- CARTE -->
<!-- ================================================= -->

<div id="map"></div>


<!-- ================================================= -->
<!-- PARTIE BASSE -->
<!-- ================================================= -->

<div id="bas">


<!-- Le titre est directement le sport -->

<div
    id="dernierTitre"
    onclick="voirDernierTrajet()"
>
    🚲 Vélo
</div>

    Aucun trajet enregistré.

<!-- ================================================= -->
<!-- ACTIONS -->
<!-- ================================================= -->

<div id="actions">

    title="GPS"

>
    🛰️
</button>


<button
    class="action"
    title="Importer TCX"
    onclick="ouvrirTCX()"
>
    📂
</button>


<button

    onclick="ouvrirSelection()"
>
    📌
</button>

>

</div>


</div>


<!-- ================================================= -->
<!-- INPUT TCX -->
<!-- ================================================= -->

<input
    id="fichier"
    type="file"
    accept=".tcx"
    multiple
    style="display:none"
>


<!-- ================================================= -->
<!-- PANNEAU SUPPRESSION -->
<!-- ================================================= -->

<div id="panneauSuppression">


<h2>🗑️ Supprimer</h2>


<button
    class="boutonSuppression"
    onclick="activerSuppressionTrajet()"
>
    Effacer un trajet
</button>


<button
    class="boutonSuppression"
    onclick="confirmerToutEffacer()"
>
    Tout effacer
</button>

    class="boutonSuppression"
    onclick="fermerSuppression()"
>

</button>


</div>


<!-- ================================================= -->
<!-- PANNEAU TRAJETS VISIBLES -->
<!-- ================================================= -->

<div id="panneauSelection">


<h2>📌 Trajets visibles</h2>


<button
    id="boutonTri"
    onclick="ouvrirTri()"
>
    Trier ▾
</button>

    class="choixTri"

>

>

</div>

>

    class="choixTri"

</div>

    id="fermerSelection"
    onclick="fermerSelection()"
>

<!-- ================================================= -->
<!-- CONFIRMATION -->
<!-- ================================================= -->

<div id="confirmation">


<h3 id="texteConfirmation">
    Supprimer ce trajet ?
</h3>

<button
    id="boutonAnnuler"
    onclick="annulerConfirmation()"
>
    Annuler
</button>

    id="boutonConfirmer"
    onclick="confirmerSuppression()"
>

</button>

</div>


<div id="message"></div>


<!-- ================================================= -->
<!-- LEAFLET -->
<!-- ================================================= -->

<script
    src="https://unpkg.com/leaflet/dist/leaflet.js"
></script>


<script>


/* ================================================= */
/* DONNÉES */
/* ================================================= */

let activites =

    JSON.parse(
        localStorage.getItem("activitesTCX")
    ) || [];


let sportActuel =

    localStorage.getItem("sportActuel")
    || "Vélo";


let lignes = [];

let trajetASupprimer = null;

let trajetsVisibles = [];


/* ================================================= */
/* CARTE */
/* ================================================= */

let map = L.map("map");


L.tileLayer(

    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom:19,

        attribution:"© OpenStreetMap"

    }

).addTo(map);


map.setView(
    [20,0],
    2
);


/* ================================================= */
/* SPORT */
/* ================================================= */

function emojiSport(sport){

    if(sport === "Vélo")
        return "🚲";

    if(sport === "Marche")
        return "🚶";

    if(sport === "Course")
        return "🏃";

    return "🏃";

}


function couleur(sport){

    if(sport === "Vélo")
        return "yellow";

    if(sport === "Marche")
        return "blue";

    if(sport === "Course")
        return "orange";

    return "red";

}


/* ================================================= */
/* AFFICHER SPORT */
/* ================================================= */

function afficherSportActuel(){

    let titre =
        emojiSport(sportActuel)
        +
        " "
        +
        sportActuel;


    document.getElementById(
        "titreSport"
    ).textContent = titre;


    document.getElementById(
        "dernierTitre"
    ).textContent = titre;


    document
        .querySelectorAll(".choixSport")
        .forEach(element=>{

            if(
                element.dataset.sport
                ===
                sportActuel
            ){

                element.classList.add(
                    "actuel"
                );

            }

            else{

                element.classList.remove(
                    "actuel"
                );

            }

        });

}


/* ================================================= */
/* MENU SPORTS */
/* ================================================= */

function ouvrirSports(){

    let menu =
        document.getElementById(
            "menuSports"
        );


    if(
        menu.style.display
        ===
        "block"
    ){

        menu.style.display =
            "none";

    }

    else{

        menu.style.display =
            "block";

    }

}


/* ================================================= */
/* CHOISIR SPORT */
/* ================================================= */

function choisirSport(sport){

    sportActuel = sport;


    localStorage.setItem(
        "sportActuel",
        sportActuel
    );


    afficherSportActuel();


    document.getElementById(
        "menuSports"
    ).style.display =
        "none";


    afficherTrajets();

    afficherDernierTrajet();

}


/* ================================================= */
/* TEMPS */
/* ================================================= */

function tempsTexte(sec){

    sec = Number(sec) || 0;


    if(sec <= 0)
        return "Inconnu";


    let heures =

        Math.floor(
            sec / 3600
        );


    let minutes =

        Math.floor(
            (sec % 3600) / 60
        );


    let secondes =

        Math.floor(
            sec % 60
        );


    if(heures > 0){

        return (

            heures
            +
            " h "
            +
            minutes
            +
            " min"

        );

    }


    return (

        minutes
        +
        " min "
        +
        secondes
        +
        " s"

    );

}


/* ================================================= */
/* AFFICHER TRAJETS DU SPORT */
/* ================================================= */

function afficherTrajets(){

    lignes.forEach(
        ligne =>
            map.removeLayer(ligne)
    );


    lignes = [];


    activites.forEach(
        (a,index)=>{

            if(
                a.sport
                !==
                sportActuel
            )
                return;


            if(
                !a.points
                ||
                a.points.length < 2
            )
                return;


            let ligne =

                L.polyline(

                    a.points,

                    {

                        color:
                            couleur(a.sport),

                        weight:4,

                        opacity:0.85

                    }

                ).addTo(map);


            ligne.activiteIndex =
                index;


            ligne.bindPopup(

                "<b>"
                +
                emojiSport(a.sport)
                +
                " "
                +
                a.sport
                +
                "</b>"
                +

                "<br><br>"

                +

                "📅 "
                +
                a.date

                +

                "<br>"

                +

                "📏 "
                +
                a.distance
                +
                " km"

                +

                "<br>"

                +

                "⏱️ "
                +
                tempsTexte(a.temps)

            );


            lignes.push(ligne);

        }
    );


    if(lignes.length > 0){

        let groupe =
            L.featureGroup(lignes);


        map.fitBounds(
            groupe.getBounds(),
            {
                padding:[20,20]
            }
        );

    }

}


/* ================================================= */
/* TROUVER DERNIER TRAJET */
/* ================================================= */

function trouverDernierTrajet(){

    let resultat = null;


    activites.forEach(
        (a,index)=>{

            if(
                a.sport
                !==
                sportActuel
            )
                return;


            if(!resultat){

                resultat = {
                    activite:a,
                    index:index
                };

                return;

            }


            let dateA =
                new Date(a.date);


            let dateB =
                new Date(
                    resultat.activite.date
                );


            if(dateA > dateB){

                resultat = {
                    activite:a,
                    index:index
                };

            }

        }
    );


    return resultat;

}


/* ================================================= */
/* AFFICHER INFOS DERNIER TRAJET */
/* ================================================= */

function afficherDernierTrajet(){

    let resultat =
        trouverDernierTrajet();


    let element =
        document.getElementById(
            "dernierInfos"
        );


    if(!resultat){

        element.innerHTML =

            "Aucun trajet de "
            +
            sportActuel.toLowerCase()
            +
            " enregistré.";

        return;

    }


    let a =
        resultat.activite;


    element.innerHTML =

        "📅 "
        +
        a.date

        +

        "<br>"

        +

        "📏 "
        +
        a.distance
        +
        " km"

        +

        "<br>"

        +

        "⏱️ "
        +
        tempsTexte(a.temps);

}


/* ================================================= */
/* VOIR DERNIER TRAJET */
/* ================================================= */

function voirDernierTrajet(){

    let resultat =
        trouverDernierTrajet();


    if(!resultat){

        afficherMessage(
            "Aucun trajet à afficher."
        );

        return;

    }


    let ligne =
        lignes.find(
            l =>
                l.activiteIndex
                ===
                resultat.index
        );


    if(!ligne)
        return;


    map.fitBounds(

        ligne.getBounds(),

        {

            padding:[30,30],

            maxZoom:17

        }

    );


    ligne.setStyle({

        color:"#00ff00",

        weight:8,

        opacity:1

    });


    ligne.bringToFront();


    setTimeout(()=>{

        ligne.setStyle({

            color:
                couleur(
                    resultat.activite.sport
                ),

            weight:4,

            opacity:0.85

        });

    },4000);

}


/* ================================================= */
/* GPS */
/* ================================================= */

function ouvrirGPS(){

    window.location.href =

        "gps.html?sport="
        +
        encodeURIComponent(
            sportActuel
        );

}


/* ================================================= */
/* TCX */
/* ================================================= */

function ouvrirTCX(){

    document
        .getElementById("fichier")
        .click();

}


document
    .getElementById("fichier")
    .addEventListener(
        "change",
        importerTCX
    );


function importerTCX(e){

    for(
        let fichier
        of e.target.files
    ){

        let lecteur =
            new FileReader();


        lecteur.onload =
            function(){

                let xml =

                    new DOMParser()
                    .parseFromString(
                        lecteur.result,
                        "text/xml"
                    );


                let sport =
                    "Autre";


                let activity =

                    xml
                    .getElementsByTagName(
                        "Activity"
                    )[0];


                if(activity){

                    sport =
                        typeSport(
                            activity
                            .getAttribute(
                                "Sport"
                            )
                        );

                }


                let date =
                    "Inconnue";


                let id =

                    xml
                    .getElementsByTagName(
                        "Id"
                    )[0];


                if(id){

                    date =
                        id.textContent
                        .substring(
                            0,
                            10
                        );

                }


                let distance = 0;


                let distances =

                    xml
                    .getElementsByTagName(
                        "DistanceMeters"
                    );


                if(distances.length){

                    distance =

                        (

                            parseFloat(

                                distances[
                                    distances.length - 1
                                ].textContent

                            )
                            /
                            1000

                        ).toFixed(2);

                }


                let temps = 0;


                let tempsXML =

                    xml
                    .getElementsByTagName(
                        "TotalTimeSeconds"
                    );


                if(tempsXML.length){

                    temps =

                        parseFloat(

                            tempsXML[0]
                            .textContent

                        );

                }


                let points = [];


                let positions =

                    xml
                    .getElementsByTagName(
                        "Position"
                    );


                for(
                    let p
                    of positions
                ){

                    let lat =

                        p
                        .getElementsByTagName(
                            "LatitudeDegrees"
                        )[0];


                    let lon =

                        p
                        .getElementsByTagName(
                            "LongitudeDegrees"
                        )[0];


                    if(lat && lon){

                        points.push([

                            parseFloat(
                                lat.textContent
                            ),

                            parseFloat(
                                lon.textContent
                            )

                        ]);

                    }

                }


                if(
                    Number(distance)
                    ===
                    0
                ){

                    let total = 0;


                    for(
                        let i=1;
                        i<points.length;
                        i++
                    ){

                        total +=

                            map.distance(

                                points[i-1],

                                points[i]

                            );

                    }


                    distance =

                        (
                            total / 1000
                        ).toFixed(2);

                }


                let activite = {

                    sport:sport,

                    date:date,

                    distance:Number(
                        distance
                    ),

                    temps:Number(
                        temps
                    ),

                    points:points

                };


                activites.push(
                    activite
                );


                localStorage.setItem(

                    "activitesTCX",

                    JSON.stringify(
                        activites
                    )

                );


                afficherTrajets();

                afficherDernierTrajet();


                afficherMessage(
                    "✅ Trajet importé"
                );

            };


        lecteur.readAsText(
            fichier
        );

    }


    e.target.value = "";

}


/* ================================================= */
/* TYPE SPORT */
/* ================================================= */

function typeSport(sport){

    sport =
        String(sport)
        .toLowerCase();


    if(

        sport.includes("biking")
        ||
        sport.includes("cycling")
        ||
        sport.includes("bicycling")

    )
        return "Vélo";


    if(
        sport.includes("run")
    )
        return "Course";


    if(

        sport.includes("walk")
        ||
        sport.includes("hike")

    )
        return "Marche";


    return "Autre";

}

/* ================================================= */
/* EFFACER UN TRAJET */
/* ================================================= */

function activerSuppressionTrajet(){

    fermerSuppression();


    let trajets =

        activites.filter(
            a =>
                a.sport
                ===
                sportActuel
        );


    if(trajets.length === 0){

        afficherMessage(
            "Aucun trajet à supprimer."
        );

        return;

    }


    let liste =
        document.getElementById(
            "listeTrajets"
        );


    liste.innerHTML = "";


    trajets.forEach(
        a=>{

            let index =
                activites.indexOf(a);


            let div =
                document.createElement(
                    "div"
                );


            div.className =
                "trajetChoix";


            div.innerHTML =

                "<b>"
                +
                emojiSport(a.sport)
                +
                " "
                +
                a.date
                +
                "</b>"
                +

                "<br>"

                +

                "📏 "
                +
                a.distance
                +
                " km"

                +

                "<br>"

                +

                "⏱️ "
                +
                tempsTexte(a.temps);


            div.onclick =
                function(){

                    demanderSuppression(
                        index
                    );

                };


            liste.appendChild(
                div
            );

        }
    );


    document.getElementById(
        "panneauSelection"
    ).style.display =
        "block";

}


/* ================================================= */
/* CONFIRMATION SUPPRESSION */
/* ================================================= */

function demanderSuppression(index){

    trajetASupprimer =
        index;


    document.getElementById(
        "panneauSelection"
    ).style.display =
        "none";


    let a =
        activites[index];


    document.getElementById(
        "texteConfirmation"
    ).textContent =

        "Supprimer le trajet du "
        +
        a.date
        +
        " ?";


    document.getElementById(
        "confirmation"
    ).style.display =
        "block";

}


/* ================================================= */
/* ANNULER */
/* ================================================= */

function annulerConfirmation(){

    trajetASupprimer =
        null;


    document.getElementById(
        "confirmation"
    ).style.display =
        "none";

}


/* ================================================= */
/* CONFIRMER */
/* ================================================= */

function confirmerSuppression(){

    if(
        trajetASupprimer
        ===
        null
    )
        return;


    if(
        trajetASupprimer
        ===
        "TOUT"
    ){

        activites = [];


        localStorage.removeItem(
            "activitesTCX"
        );


        trajetASupprimer =
            null;


        document.getElementById(
            "confirmation"
        ).style.display =
            "none";


        afficherTrajets();

        afficherDernierTrajet();


        afficherMessage(
            "🗑️ Tous les trajets ont été supprimés"
        );


        return;

    }


    activites.splice(
        trajetASupprimer,
        1
    );


    localStorage.setItem(

        "activitesTCX",

        JSON.stringify(
            activites
        )

    );


    trajetASupprimer =
        null;


    document.getElementById(
        "confirmation"
    ).style.display =
        "none";


    afficherTrajets();

    afficherDernierTrajet();


    afficherMessage(
        "🗑️ Trajet supprimé"
    );

}


/* ================================================= */
/* TOUT EFFACER */
/* ================================================= */

function confirmerToutEffacer(){

    fermerSuppression();


    if(
        activites.length === 0
    ){

        afficherMessage(
            "Aucun trajet enregistré."
        );

        return;

    }


    trajetASupprimer =
        "TOUT";


    document.getElementById(
        "texteConfirmation"
    ).textContent =

        "Effacer tous les trajets ?";


    document.getElementById(
        "confirmation"
    ).style.display =
        "block";

}


/* ================================================= */
/* 📌 TRAJETS VISIBLES */
/* ================================================= */

function ouvrirSelection(){

    let bounds =
        map.getBounds();


    trajetsVisibles = [];


    activites.forEach(
        (a,index)=>{

            /* Seulement le sport actuel */

            if(
                a.sport
                !==
                sportActuel
            )
                return;


            if(
                !a.points
                ||
                a.points.length === 0
            )
                return;


            /* Un seul point visible suffit */

            let visible =
                a.points.some(
                    point =>
                        bounds.contains(
                            [
                                point[0],
                                point[1]
                            ]
                        )
                );


            if(visible){

                trajetsVisibles.push(
                    index
                );

            }

        }
    );


    afficherListeVisible();


    document.getElementById(
        "panneauSelection"
    ).style.display =
        "block";

}


/* ================================================= */
/* AFFICHER LISTE VISIBLE */
/* ================================================= */

function afficherListeVisible(){

    let liste =
        document.getElementById(
            "listeTrajets"
        );


    liste.innerHTML = "";


    if(
        trajetsVisibles.length === 0
    ){

        liste.innerHTML =

            "<p style='text-align:center;'>"
            +
            "Aucun trajet visible."
            +
            "</p>";

        return;

    }


    trajetsVisibles.forEach(
        index=>{

            let a =
                activites[index];


            let div =
                document.createElement(
                    "div"
                );


            div.className =
                "trajetChoix";


            div.innerHTML =

                "<b>"
                +
                emojiSport(a.sport)
                +
                " "
                +
                a.date
                +
                "</b>"

                +

                "<br>"

                +

                "📏 "
                +
                a.distance
                +
                " km"

                +

                "<br>"

                +

                "⏱️ "
                +
                tempsTexte(a.temps);


            div.onclick =
                function(){

                    voirTrajet(
                        index
                    );

                };


            liste.appendChild(
                div
            );

        }
    );

}

/* ================================================= */
/* TRIER */
/* ================================================= */

function trier(type){

    trajetsVisibles.sort(
        (a,b)=>{

            let x =
                activites[a];


            let y =
                activites[b];


            if(
                type
                ===
                "datePlus"
            ){

                return new Date(y.date)
                    -
                    new Date(x.date);

            }


            if(
                type
                ===
                "dateMoins"
            ){

                return new Date(x.date)
                    -
                    new Date(y.date);

            }


            if(
                type
                ===
                "kmPlus"
            ){

                return y.distance
                    -
                    x.distance;

            }


            if(
                type
                ===
                "kmMoins"
            ){

                return x.distance
                    -
                    y.distance;

            }


            if(
                type
                ===
                "tempsPlus"
            ){

                return y.temps
                    -
                    x.temps;

            }


            if(
                type
                ===
                "tempsMoins"
            ){

                return x.temps
                    -
                    y.temps;

            }


            return 0;

        }
    );


    document.getElementById(
        "menuTri"
    ).style.display =
        "none";


    afficherListeVisible();

}


/* ================================================= */
/* VOIR UN TRAJET DE LA LISTE */
/* ================================================= */

function voirTrajet(index){

    fermerSelection();


    let ligne =
        lignes.find(
            l =>
                l.activiteIndex
                ===
                index
        );


    if(!ligne)
        return;


    map.fitBounds(

        ligne.getBounds(),

        {

            padding:[30,30],

            maxZoom:17

        }

    );


    ligne.setStyle({

        color:"#00ff00",

        weight:8,

        opacity:1

    });


    ligne.bringToFront();


    setTimeout(()=>{

        ligne.setStyle({

            color:
                couleur(
                    activites[index].sport
                ),

            weight:4,

            opacity:0.85

        });

    },4000);

}


/* ================================================= */
/* MESSAGE */
/* ================================================= */

function afficherMessage(texte){

    let message =
        document.getElementById(
            "message"
        );


    message.textContent =
        texte;


    message.style.display =
        "block";


    setTimeout(
        ()=>{

            message.style.display =
                "none";

        },
        2500
    );

}
