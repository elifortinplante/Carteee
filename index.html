<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Map Vélo</title>


<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">


<style>

body{

margin:0;
font-family:Arial;
text-align:center;

}


button{

padding:12px;
margin:5px;
font-size:16px;

}


input{

padding:10px;
margin:5px;
font-size:16px;

}



#map{

height:75vh;

}



.page{

display:none;

}



.active{

display:block;

}



.carte{

background:#f2f2f2;
border-radius:15px;
padding:20px;
margin:15px auto;
width:80%;
max-width:400px;

}


</style>


</head>


<body>



<h1>🚴 Map Vélo</h1>




<!-- MENU PRINCIPAL -->


<div>


<button onclick="ouvrirPage('carte')">
🗺️ Carte
</button>


<button onclick="ouvrirPage('stats')">
📊 Statistiques
</button>


<button onclick="ouvrirPage('amis')">
👥 Amis
</button>


<button onclick="ouvrirPage('classement')">
🏆 Classement
</button>


<button onclick="ouvrirPage('profil')">
⚙️ Profil
</button>


</div>







<!-- PAGE CARTE -->


<div id="carte" class="page active">


<button onclick="ouvrirTCX()">

📂 Importer TCX

</button>


<button onclick="selectionnerTrajets()">

☑️ Sélectionner

</button>



<button onclick="effacer()">

🗑️ Effacer

</button>



<input

id="fichier"

type="file"

accept=".tcx"

multiple

>



<div id="map"></div>


</div>







<!-- PAGE STATISTIQUES -->


<div id="stats" class="page">


<h2>📊 Statistiques</h2>



<button onclick="filtrerStats('toujours')">

Toujours

</button>


<button onclick="filtrerStats('annee')">

Année

</button>


<button onclick="filtrerStats('mois')">

Mois

</button>


<button onclick="filtrerStats('semaine')">

Semaine

</button>


<button onclick="filtrerStats('jour')">

Jour

</button>



<div id="resultatStats"></div>



</div>








<!-- PAGE AMIS -->


<div id="amis" class="page">


<h2>👥 Amis</h2>



<input

id="emailAmi"

placeholder="Email de l'ami"

>



<button onclick="ajouterAmi(emailAmi.value)">

➕ Ajouter

</button>



<div id="listeAmis"></div>



</div>









<!-- PAGE CLASSEMENT -->


<div id="classement" class="page">


<h2>🏆 Classement</h2>


<div id="listeClassement"></div>



</div>








<!-- PAGE PROFIL -->


<div id="profil" class="page">


<h2>⚙️ Profil</h2>



<div id="infosProfil"></div>



<input

id="nomProfil"

placeholder="Ton nom"

>



<button onclick="sauvegarderProfil()">

💾 Sauvegarder

</button>




</div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script type="module">


// =====================
// FIREBASE
// =====================


import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import { 

getFirestore,

doc,

setDoc,

getDoc,

collection,

addDoc,

getDocs

}

from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";



import {


getAuth,

onAuthStateChanged,

createUserWithEmailAndPassword,

signInWithEmailAndPassword,

signOut


}

from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";







const firebaseConfig = {


apiKey:

"AIzaSyC-4f3v5hKMeGKKd1NwvZt_h1Mx1g1yXFE",


authDomain:

"map-velo-f63ad.firebaseapp.com",


projectId:

"map-velo-f63ad",


storageBucket:

"map-velo-f63ad.firebasestorage.app",


messagingSenderId:

"915926626440",


appId:

"1:915926626440:web:96868d343fce5c5d2a2f3d"


};






const app = initializeApp(firebaseConfig);



const db = getFirestore(app);



const auth = getAuth(app);




let utilisateur = null;






onAuthStateChanged(auth,(user)=>{


utilisateur=user;



if(user){


console.log(

"Connecté : "+user.email

);



chargerProfil();



}



});








// =====================
// NAVIGATION
// =====================


window.ouvrirPage=function(nom){



document

.querySelectorAll(".page")

.forEach(p=>{


p.classList.remove("active");


});





document

.getElementById(nom)

.classList.add("active");





if(nom=="carte"){



setTimeout(()=>{


map.invalidateSize();


},200);



}



};








// =====================
// DONNÉES LOCALES
// =====================



let activites =

JSON.parse(

localStorage.getItem("activitesTCX")

)

|| [];




let lignes=[];
  // =====================
// CARTE LEAFLET
// =====================


let map = L.map("map")

.setView([20,0],2);




L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19,

attribution:"© OpenStreetMap"

}

).addTo(map);







// =====================
// COULEUR DES TRAJETS
// =====================


function couleur(sport){



sport=

String(sport).toLowerCase();





if(

sport.includes("bike") ||

sport.includes("vélo") ||

sport.includes("cycling")

)

return "yellow";





if(

sport.includes("run") ||

sport.includes("course")

)

return "orange";





if(

sport.includes("walk") ||

sport.includes("marche")

)

return "blue";





return "red";



}









// =====================
// FORMAT DU TEMPS
// =====================


function tempsTexte(sec){



sec=

Number(sec)||0;



let h=

Math.floor(sec/3600);



let m=

Math.floor(

(sec%3600)/60

);




return h+" h "+m+" min";


}









// =====================
// OUVRIR TCX
// =====================


window.ouvrirTCX=function(){


document

.getElementById("fichier")

.click();



};










// =====================
// IMPORT DU FICHIER TCX
// =====================


document

.getElementById("fichier")

.addEventListener(

"change",

function(e){



for(let fichier of e.target.files){



let lecteur=new FileReader();




lecteur.onload=function(){



let xml =

new DOMParser()

.parseFromString(

lecteur.result,

"text/xml"

);





console.log(

"TCX chargé"

);





// La lecture complète du TCX arrive partie 4



};




lecteur.readAsText(fichier);



}



}

);
  // =====================
// LECTURE TCX
// =====================


let sport="Autre";



let activity=

xml.getElementsByTagName(

"Activity"

)[0];



if(activity){


sport=

activity.getAttribute("Sport")

||"Autre";


}






let date="Inconnue";



let id=

xml.getElementsByTagName(

"Id"

)[0];



if(id){


date=

id.textContent.substring(

0,

10

);


}






let distance=0;



let distances=

xml.getElementsByTagName(

"DistanceMeters"

);





if(distances.length){



distance=

(

parseFloat(

distances[distances.length-1]

.textContent

)

/1000

).toFixed(2);



}








let temps=0;



let tempsXML=

xml.getElementsByTagName(

"TotalTimeSeconds"

);





if(tempsXML.length){



temps=

parseFloat(

tempsXML[0].textContent

);



}









// =====================
// POINTS GPS
// =====================


let points=[];



let positions=

xml.getElementsByTagName(

"Position"

);






for(let p of positions){



let lat=

p.getElementsByTagName(

"LatitudeDegrees"

)[0];



let lon=

p.getElementsByTagName(

"LongitudeDegrees"

)[0];






if(lat && lon){



points.push([


parseFloat(

lat.textContent

),


parseFloat(

lon.textContent

)


]);



}



}








// Calcul distance si absente


if(distance==0){



let total=0;



for(

let i=1;

i<points.length;

i++

){



total +=

map.distance(

points[i-1],

points[i]

);



}



distance=

(

total/1000

).toFixed(2);



}







// =====================
// ENREGISTREMENT LOCAL
// =====================



let activite={



sport:sport,


date:date,


distance:Number(distance),


temps:Number(temps),


points:points



};






activites.push(activite);





localStorage.setItem(

"activitesTCX",

JSON.stringify(

activites

)

);







// =====================
// AFFICHAGE CARTE
// =====================



let ligne=

L.polyline(

points,

{


color:

couleur(sport),


weight:4


}

)

.addTo(map);





lignes.push(ligne);





ligne.bindPopup(`


<b>${sport}</b>

<br>

📅 ${date}

<br>

📏 ${distance} km

<br>

⏱ ${tempsTexte(temps)}


`);







if(points.length){


map.fitBounds(points);



}






console.log(

"Trajet ajouté"

);
  // =====================
// AFFICHER LES TRAJETS EXISTANTS
// =====================


function afficherTrajets(){



// Supprimer les anciennes lignes

lignes.forEach(ligne=>{


map.removeLayer(ligne);


});



lignes=[];






activites.forEach(a=>{



let ligne=

L.polyline(

a.points,

{


color:

couleur(a.sport),


weight:4


}

)

.addTo(map);





lignes.push(ligne);





ligne.bindPopup(`


<b>${a.sport}</b>

<br>

📅 ${a.date}

<br>

📏 ${a.distance} km

<br>

⏱ ${tempsTexte(a.temps)}


`);




});



}









// Charger au démarrage


afficherTrajets();









// =====================
// EFFACER
// =====================



window.effacer=function(){



if(confirm(

"Effacer tous les trajets ?"

)){



activites=[];



localStorage.removeItem(

"activitesTCX"

);



afficherTrajets();



}



};









// =====================
// SÉLECTION DES TRAJETS
// =====================



window.selectionnerTrajets=function(){



let zone=

map.getBounds();



let selection=[];





activites.forEach(a=>{



for(let point of a.points){



if(zone.contains(point)){



selection.push(a);



break;


}



}



});







if(selection.length==0){



alert(

"Aucun trajet dans la zone visible"

);



return;



}







let texte="";





selection.forEach(a=>{



texte +=



`

<b>${a.sport}</b>

<br>

📏 ${a.distance} km

<br>

⏱ ${tempsTexte(a.temps)}

<hr>

`;



});






let fenetre=

window.open(

"",

"trajets",

"width=400,height=500"

);






fenetre.document.write(



`

<h2>Trajets sélectionnés</h2>

${texte}

`

);



};
  // =====================
// CALCUL STATISTIQUES
// =====================


function calculerStatistiques(liste){



let km=0;


let temps=0;


let nombre=0;






liste.forEach(a=>{



km += Number(a.distance)||0;


temps += Number(a.temps)||0;


nombre++;



});






return {


km:km,


temps:temps,


nombre:nombre



};



}









function afficherStatistiques(liste){



let stats=

calculerStatistiques(liste);






document.getElementById(

"resultatStats"

).innerHTML=



`

<div class="carte">


<h3>📊 Résultats</h3>


🚴 Activités :

${stats.nombre}


<br><br>


📏 Distance :

${stats.km.toFixed(2)} km


<br><br>


⏱ Temps :

${tempsTexte(stats.temps)}



</div>


`;



}









// =====================
// FILTRES
// =====================



window.filtrerStats=function(type){



let maintenant=

new Date();





let liste=

activites.filter(a=>{



let date=

new Date(a.date);







if(type=="toujours"){



return true;



}







if(type=="annee"){



return date.getFullYear()

===

maintenant.getFullYear();



}







if(type=="mois"){



return (

date.getMonth()

===

maintenant.getMonth()

&&


date.getFullYear()

===

maintenant.getFullYear()

);



}







if(type=="semaine"){



let difference=

maintenant-date;



return difference >=0 &&

difference <=

7*24*60*60*1000;



}







if(type=="jour"){



return a.date ===

maintenant.toISOString()

.substring(0,10);



}







return false;



});






afficherStatistiques(liste);



};








// Afficher au départ


afficherStatistiques(activites);
  // =====================
// PROFIL UTILISATEUR
// =====================



async function chargerProfil(){



if(!utilisateur)

return;






let profil =

await getDoc(


doc(

db,

"utilisateurs",

utilisateur.uid

)


);







if(profil.exists()){



let donnees=

profil.data();





document.getElementById(

"nomProfil"

).value =

donnees.nom || "";







document.getElementById(

"infosProfil"

).innerHTML=



`

📧 ${utilisateur.email}

<br><br>

👤 ${donnees.nom || "Aucun nom"}

<br><br>

⭐ Niveau :

${donnees.niveau || 1}

<br><br>

✨ XP :

${donnees.xp || 0}



`;



}

else{



document.getElementById(

"infosProfil"

).innerHTML=



`

📧 ${utilisateur.email}

`;



}



}









// =====================
// SAUVEGARDER PROFIL
// =====================



window.sauvegarderProfil = async function(){



if(!utilisateur){



alert(

"Connecte-toi d'abord"

);



return;



}






await setDoc(



doc(

db,

"utilisateurs",

utilisateur.uid

),



{


email:

utilisateur.email,


nom:

document.getElementById(

"nomProfil"

).value,


niveau:

1,


xp:

0



},



{


merge:true


}



);






alert(

"Profil enregistré ✅"

);



chargerProfil();



};









// =====================
// CONNEXION
// =====================



window.creerCompte = async function(email,mdp){



try{



await createUserWithEmailAndPassword(

auth,

email,

mdp

);



alert(

"Compte créé"

);



}

catch(e){



alert(

e.message

);



}



};








window.seConnecter = async function(email,mdp){



try{



await signInWithEmailAndPassword(

auth,

email,

mdp

);



alert(

"Connecté"

);



}

catch(e){



alert(

e.message

);



}



};








window.deconnexion = async function(){



await signOut(auth);



location.reload();



};
  // =====================
// AJOUTER UN AMI
// =====================


window.ajouterAmi = async function(emailAmi){



if(!utilisateur){



alert(

"Tu dois être connecté"

);



return;



}






if(!emailAmi){



alert(

"Entre un email"

);



return;



}






await addDoc(


collection(

db,

"utilisateurs",

utilisateur.uid,

"amis"

),



{


email:

emailAmi


}



);







alert(

"Ami ajouté ✅"

);





afficherAmis();



};









// =====================
// AFFICHER LES AMIS
// =====================



async function afficherAmis(){



if(!utilisateur)

return;







let zone=

document.getElementById(

"listeAmis"

);



zone.innerHTML="";






let amis=

await getDocs(


collection(

db,

"utilisateurs",

utilisateur.uid,

"amis"

)



);






amis.forEach(ami=>{



let bouton=

document.createElement(

"button"

);





bouton.innerHTML=

"👤 "+ami.data().email;






bouton.onclick=function(){



voirAmi(

ami.data().email

);



};






zone.appendChild(bouton);



});



}








// Charger automatiquement


setTimeout(()=>{


afficherAmis();



},2000);
  // =====================
// VOIR UN AMI
// =====================


window.voirAmi = async function(emailAmi){



let utilisateurs =

await getDocs(

collection(

db,

"utilisateurs"

)

);





let ami=null;





utilisateurs.forEach(u=>{



if(u.data().email===emailAmi){



ami={


id:u.id,


data:u.data()



};



}



});







if(!ami){



alert(

"Ami introuvable"

);



return;



}







afficherComparaison(ami);



};









// =====================
// COMPARAISON
// =====================


function afficherComparaison(ami){



let mesKm=0;


let mesTemps=0;






activites.forEach(a=>{



mesKm += Number(a.distance)||0;


mesTemps += Number(a.temps)||0;



});







let kmAmi=

Number(

ami.data.distanceTotale

)

||0;






let tempsAmi=

Number(

ami.data.tempsTotal

)

||0;






let difference=

mesKm-kmAmi;






document.getElementById(

"resultatStats"

).innerHTML=



`

<div class="carte">


<h2>👤 ${ami.data.nom || ami.data.email}</h2>


📏 Son total :

${kmAmi.toFixed(2)} km


<br><br>


📏 Ton total :

${mesKm.toFixed(2)} km


<br><br>


⚖️ Différence :

${difference.toFixed(2)} km


<br><br>


⏱ Son temps :

${tempsTexte(tempsAmi)}


<br><br>


⏱ Ton temps :

${tempsTexte(mesTemps)}



</div>


`;





ouvrirPage("stats");



}









// =====================
// CLASSEMENT
// =====================


window.afficherClassement = async function(){



let classement=[];






let mesKm=0;



activites.forEach(a=>{



mesKm += Number(a.distance)||0;



});







classement.push({



nom:"Moi",


km:mesKm



});








let utilisateurs=

await getDocs(

collection(

db,

"utilisateurs"

)

);







utilisateurs.forEach(u=>{



classement.push({



nom:

u.data().nom || u.data().email,


km:

u.data().distanceTotale || 0



});



});









classement.sort(

(a,b)=>b.km-a.km

);







let texte="🏆 Classement<br><br>";





classement.forEach((p,i)=>{



texte +=



`

<div class="carte">


${i+1} - ${p.nom}


<br>


📏 ${Number(p.km).toFixed(2)} km


</div>


`;



});






document.getElementById(

"listeClassement"

).innerHTML=texte;



};









// =====================
// XP ET NIVEAU
// =====================



function calculerNiveau(xp){



return Math.floor(

xp/1000

)+1;



}







async function ajouterXP(gain){



if(!utilisateur)

return;






let ref=

doc(

db,

"utilisateurs",

utilisateur.uid

);






let profil=

await getDoc(ref);





let xp=0;



if(profil.exists()){



xp=

profil.data().xp || 0;



}






xp += gain;







await setDoc(

ref,

{


xp:xp,


niveau:

calculerNiveau(xp)



},



{

merge:true

}



);



}
  <!-- =====================
FIN DU JAVASCRIPT
===================== -->


<script>


// Vérifier que la carte se redimensionne correctement


setTimeout(()=>{


if(typeof map !== "undefined"){


map.invalidateSize();



}


},1000);





// Afficher les statistiques au démarrage


setTimeout(()=>{


if(typeof afficherStatistiques === "function"){


afficherStatistiques(activites);


}



},1500);





</script>



</body>


</html>
