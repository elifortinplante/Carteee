<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carte TCX</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">


<style>

body{
margin:0;
font-family:Arial;
}


button{
padding:12px;
margin:5px;
font-size:16px;
}


#map{
height:85vh;
}


input{
display:none;
}



/* Fenêtre des trajets sélectionnés */

#selectionBox{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:white;

z-index:1000;

overflow:auto;

padding:20px;

box-sizing:border-box;

}



#fermerSelection{

position:absolute;

right:15px;

top:15px;

font-size:25px;

}



.trajet{

background:#f2f2f2;

border-radius:15px;

padding:15px;

margin:10px;

font-size:18px;

}



.trajet button{

width:100%;

}



#tri{

text-align:center;

}



</style>

</head>


<body>



<button onclick="ouvrirTCX()">
📂 Importer TCX
</button>



<button onclick="location.href='stats.html'">
📊 Statistiques
</button>



<button onclick="effacer()">
🗑️ Effacer
</button>



<button onclick="modeSelection()">
📌 Sélectionner
</button>




<input id="fichier" type="file" accept=".tcx" multiple>





<div id="map"></div>





<div id="selectionBox">


<button id="fermerSelection" onclick="fermerSelection()">
✕
</button>



<h2>
Trajets sélectionnés
</h2>




<div id="tri">


Trier par :


<br>


<button onclick="trier('dateRecent')">
Date récente
</button>


<button onclick="trier('dateAncienne')">
Date ancienne
</button>


<button onclick="trier('distancePlus')">
Distance +
</button>


<button onclick="trier('distanceMoins')">
Distance -
</button>


<button onclick="trier('tempsPlus')">
Temps +
</button>


<button onclick="trier('tempsMoins')">
Temps -
</button>



</div>




<div id="listeSelection"></div>



</div>





<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>


let map=L.map("map").setView([20,0],2);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19,

attribution:"© OpenStreetMap"

}

).addTo(map);





let activites =

JSON.parse(localStorage.getItem("activitesTCX")) || [];





let lignes=[];


let trajetsSelectionnes=[];







function typeSport(sport){


sport=String(sport).toLowerCase();



if(

sport.includes("biking") ||

sport.includes("cycling") ||

sport.includes("bicycling")

){

return "Vélo";

}



if(

sport.includes("run")

){

return "Course";

}



if(

sport.includes("walk") ||

sport.includes("hike")

){

return "Marche";

}



return "Autre";


}








function couleur(sport){


if(sport=="Vélo")

return "yellow";



if(sport=="Course")

return "orange";



if(sport=="Marche")

return "blue";



return "red";


}









function tempsTexte(sec){


if(!sec)

return "Inconnu";



let h=Math.floor(sec/3600);


let m=Math.floor((sec%3600)/60);



return h+" h "+m+" min";


}









function afficher(){



lignes=[];



activites.forEach((a,index)=>{



let ligne=L.polyline(

a.points,

{

color:couleur(a.sport),

weight:4

}

).addTo(map);





ligne.activiteIndex=index;





ligne.bindPopup(`

<b>${a.sport}</b><br>

📅 ${a.date}<br>

📏 ${a.distance} km<br>

⏱ ${tempsTexte(a.temps)}

`);




lignes.push(ligne);



});



}









function ouvrirTCX(){


document

.getElementById("fichier")

.click();


}









document

.getElementById("fichier")

.addEventListener("change",function(e){



for(let fichier of e.target.files){



let lecteur=new FileReader();



lecteur.onload=function(){



let xml=

new DOMParser()

.parseFromString(

lecteur.result,

"text/xml"

);






let sport="Autre";



let activity=

xml.getElementsByTagName("Activity")[0];



if(activity){


sport=

typeSport(

activity.getAttribute("Sport")

);


}








let date="Inconnue";



let id=

xml.getElementsByTagName("Id")[0];



if(id){


date=

id.textContent.substring(0,10);


}







let distance=0;



let distances=

xml.getElementsByTagName("DistanceMeters");



if(distances.length){



distance=

(

parseFloat(

distances[distances.length-1].textContent

)

/1000

).toFixed(2);



}








let temps=0;



let tempsXML=

xml.getElementsByTagName("TotalTimeSeconds");



if(tempsXML.length){


temps=

parseFloat(

tempsXML[0].textContent

);


}







let points=[];



let positions=

xml.getElementsByTagName("Position");



for(let p of positions){



let lat=

p.getElementsByTagName("LatitudeDegrees")[0];



let lon=

p.getElementsByTagName("LongitudeDegrees")[0];



if(lat && lon){



points.push([

parseFloat(lat.textContent),

parseFloat(lon.textContent)

]);


}



}









if(distance==0){



let total=0;



for(let i=1;i<points.length;i++){



total+=map.distance(

points[i-1],

points[i]

);



}



distance=

(total/1000).toFixed(2);



}









let activite={


sport:sport,


date:date,


distance:Number(distance),


temps:Number(temps),


points:points


};






activites.push(activite);





localStorage.setItem(

"activitesTCX",

JSON.stringify(activites)

);








let ligne=L.polyline(

points,

{

color:couleur(sport),

weight:4

}

).addTo(map);






ligne.activiteIndex=

activites.length-1;






lignes.push(ligne);






ligne.bindPopup(`


<b>${sport}</b><br>


📅 ${date}<br>


📏 ${distance} km<br>


⏱ ${tempsTexte(temps)}


`);






map.fitBounds(points);






};



lecteur.readAsText(fichier);



}



});
function modeSelection(){



let vueActuelle = map.getBounds();



trajetsSelectionnes=[];



activites.forEach((a,index)=>{



for(let point of a.points){



if(

vueActuelle.contains([

point[0],

point[1]

])

){



trajetsSelectionnes.push(index);


break;


}



}



});





afficherSelection();



}









function afficherSelection(){



let liste=

document.getElementById("listeSelection");



liste.innerHTML="";





trajetsSelectionnes.forEach(index=>{



let a=activites[index];



let div=document.createElement("div");



div.className="trajet";



div.innerHTML=`

📅 ${a.date}

<br>

📏 ${a.distance} km

<br>

⏱ ${tempsTexte(a.temps)}

<br><br>


<button onclick="voirTrajet(${index})">

📍 Voir ce trajet

</button>

`;



liste.appendChild(div);



});





document

.getElementById("selectionBox")

.style.display="block";



}









function trier(type){



trajetsSelectionnes.sort((a,b)=>{



let x=activites[a];

let y=activites[b];



if(type=="dateRecent")

return new Date(y.date)-new Date(x.date);



if(type=="dateAncienne")

return new Date(x.date)-new Date(y.date);



if(type=="distancePlus")

return y.distance-x.distance;



if(type=="distanceMoins")

return x.distance-y.distance;



if(type=="tempsPlus")

return y.temps-x.temps;



if(type=="tempsMoins")

return x.temps-y.temps;



});



afficherSelection();



}









function voirTrajet(index){



fermerSelection();



let ligne=lignes[index];



map.fitBounds(

ligne.getBounds()

);



ligne.setStyle({

color:"lime",

weight:8

});



setTimeout(()=>{



ligne.setStyle({

color:couleur(

activites[index].sport

),

weight:4

});



},4000);



}









function fermerSelection(){



document

.getElementById("selectionBox")

.style.display="none";



}









function effacer(){



if(confirm("Effacer toutes les activités ?")){


localStorage.removeItem(

"activitesTCX"

);



location.reload();



}


}








afficher();



</script>


</body>


</html>
